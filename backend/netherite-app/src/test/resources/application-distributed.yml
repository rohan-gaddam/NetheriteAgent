spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:netherite_distributed}
    username: ${DB_USER:netherite_admin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 6
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/postgresql

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms

netherite:
  environment: test
  distributed:
    provider: redis
  opa:
    url: http://localhost:8181
    policy-path: /v1/data/netherite/authz/evaluation_output
    timeout-ms: 200
  llm:
    provider: none
  auth:
    owner:
      email: strangeunknown03@gmail.com
      password-hash: $2b$10$C9A8I18DD6SzKhOnjxE49.beH6hGJjswSSeS5ci3AlfNGkkqfkzuy
      organization-name: NetheriteAgent Distributed
      organization-slug: netherite-distributed
    session:
      cookie-name: neth_sid
      cookie-secure: ""
      cookie-same-site: Lax
      ttl-seconds: 86400

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always