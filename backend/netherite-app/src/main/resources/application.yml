server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Do not advertise the container/runtime banner (default would echo the
  # servlet container name/version to anyone who can reach a socket); Caddy
  # replaces this header at the edge anyway.
  server-header: ""
  # The application sits behind a trusted reverse proxy (Caddy). Native header handling lets the
  # Tomcat RemoteIpValve rewrite getRemoteAddr() from X-Forwarded-For ONLY for trusted internal
  # proxies (default RFC1918 + loopback; override server.tomcat.remoteip.internal-proxies with your
  # real LB CIDR), so rate-limit IP keys reflect the true client, never a spoofable header.
  forward-headers-strategy: native

spring:
  application:
    name: netherite-agent-control-plane

  # WS8: the human-readable logback profile is the default; docker-compose activates
  # "structured" (SPRING_PROFILES_ACTIVE) in production to emit JSON console logs.
  profiles:
    default: plain

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT_SECONDS:30}s

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:netherite}
    username: ${DB_USER:netherite_admin}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/postgresql

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms

# Enterprise Control Plane Configuration
netherite:
  environment: ${NETHERITE_ENV:development}
  distributed:
    provider: ${DISTRIBUTED_PROVIDER:redis}
    lock-prefix: ${DISTRIBUTED_LOCK_PREFIX:netherite:lock:}
    node:
      id: ${NODE_ID:}
    lock:
      execution-wait-millis: ${EXECUTION_LOCK_WAIT_MS:5000}
      execution-lease-millis: ${EXECUTION_LOCK_LEASE_MS:30000}
    idempotency:
      execution-ttl-minutes: ${IDEMPOTENCY_EXECUTION_TTL_MIN:30}
      completed-ttl-minutes: ${IDEMPOTENCY_COMPLETED_TTL_MIN:30}
      failed-ttl-seconds: ${IDEMPOTENCY_FAILED_TTL_SEC:120}
      cleanup-interval-ms: ${IDEMPOTENCY_CLEANUP_INTERVAL_MS:1800000}
      approval-lease-minutes: ${APPROVAL_EXECUTION_LEASE_MIN:15}
      approval-max-attempts: ${APPROVAL_EXECUTION_MAX_ATTEMPTS:3}
      approval-recovery-interval-ms: ${APPROVAL_RECOVERY_INTERVAL_MS:60000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Non-security-critical routes keep working when Redis is unreachable; routes
    # declaring fail-closed: true deny (503) instead, never admitting a flood.
    default-on-redis-error: ${RATE_LIMIT_DEFAULT_ON_REDIS_ERROR:fail-open}
    dependency:
      connect-timeout-millis: ${RATE_LIMIT_CONNECT_TIMEOUT_MS:500}
      timeout-millis: ${RATE_LIMIT_TIMEOUT_MS:500}
      retry-attempts: ${RATE_LIMIT_RETRY_ATTEMPTS:0}
      circuit-break-failures: ${RATE_LIMIT_CIRCUIT_BREAK_FAILURES:3}
      circuit-break-open-millis: ${RATE_LIMIT_CIRCUIT_BREAK_OPEN_MS:5000}
    routes:
      - name: owner-login
        methods: [POST]
        path: /v1/auth/login
        fail-closed: true
        buckets:
          - { dimension: IP, limit: 10, window-seconds: 60 }
          - { dimension: LOGIN_ACCOUNT_IP, limit: 5, window-seconds: 60 }
          - { dimension: LOGIN_ACCOUNT, limit: 30, window-seconds: 3600 }
      - name: oidc
        path: /v1/auth/oidc/**
        fail-closed: true
        buckets:
          - { dimension: IP, limit: 30, window-seconds: 60 }
      - name: agent-execution
        methods: [POST]
        path: /v1/actions/**
        fail-closed: true
        buckets:
          - { dimension: IP, limit: 600, window-seconds: 3600 }
          - { dimension: AGENT_KEY_IDENTIFIER, limit: 600, window-seconds: 3600 }
          - { dimension: ORGANIZATION, limit: 2000, window-seconds: 3600 }
      - name: gateway-execute
        methods: [POST]
        path: /v1/gateway/execute
        fail-closed: true
        buckets:
          - { dimension: AGENT_KEY_IDENTIFIER, limit: 600, window-seconds: 3600 }
          - { dimension: ORGANIZATION, limit: 2000, window-seconds: 3600 }
      - name: gateway-integration
        methods: [GET]
        path: /v1/gateway/integration
        buckets:
          - { dimension: IP, limit: 60, window-seconds: 3600 }
      - name: approval-decision
        methods: [POST]
        path: /v1/approvals/{ticketId}/approve
        fail-closed: true
        buckets:
          - { dimension: USER, limit: 120, window-seconds: 3600 }
          - { dimension: ORGANIZATION, limit: 300, window-seconds: 3600 }
      - name: approval-reject
        methods: [POST]
        path: /v1/approvals/{ticketId}/reject
        fail-closed: true
        buckets:
          - { dimension: USER, limit: 120, window-seconds: 3600 }
          - { dimension: ORGANIZATION, limit: 300, window-seconds: 3600 }
      - name: approval-queue
        methods: [GET]
        path: /v1/approvals/**
        buckets:
          - { dimension: USER, limit: 300, window-seconds: 300 }
          - { dimension: ORGANIZATION, limit: 600, window-seconds: 300 }
      - name: admin-agents
        path: /v1/agents/**
        fail-closed: true
        buckets:
          - { dimension: USER, limit: 300, window-seconds: 300 }
          - { dimension: ORGANIZATION, limit: 600, window-seconds: 300 }
      - name: admin-resources
        path: /v1/resources/**
        fail-closed: true
        buckets:
          - { dimension: USER, limit: 300, window-seconds: 300 }
          - { dimension: ORGANIZATION, limit: 600, window-seconds: 300 }
      - name: admin-bindings
        path: /v1/bindings/**
        fail-closed: true
        buckets:
          - { dimension: USER, limit: 300, window-seconds: 300 }
          - { dimension: ORGANIZATION, limit: 600, window-seconds: 300 }
      - name: admin-policies
        path: /v1/policies/**
        fail-closed: true
        buckets:
          - { dimension: USER, limit: 300, window-seconds: 300 }
          - { dimension: ORGANIZATION, limit: 600, window-seconds: 300 }
      - name: admin-users
        path: /v1/users/**
        fail-closed: true
        buckets:
          - { dimension: USER, limit: 300, window-seconds: 300 }
          - { dimension: ORGANIZATION, limit: 600, window-seconds: 300 }
      - name: control-plane
        path: /v1/control/**
        fail-closed: true
        buckets:
          - { dimension: USER, limit: 120, window-seconds: 300 }
          - { dimension: ORGANIZATION, limit: 300, window-seconds: 300 }
      - name: audit-read
        methods: [GET]
        path: /v1/audit/**
        buckets:
          - { dimension: USER, limit: 300, window-seconds: 3600 }
          - { dimension: ORGANIZATION, limit: 1200, window-seconds: 3600 }
      - name: dashboard
        path: /v1/dashboard/**
        buckets:
          - { dimension: USER, limit: 60, window-seconds: 60 }
          - { dimension: ORGANIZATION, limit: 120, window-seconds: 60 }
  opa:
    url: ${OPA_URL:http://localhost:8181}
    policy-path: /v1/data/netherite/authz/evaluation_output
    timeout-ms: ${OPA_TIMEOUT_MS:200}
    # Bearer credential for the authenticated policy engine (OPA
    # --authentication=token --authorization=basic). Blank = no header (a bare
    # engine or a harness that runs with authorization off). Delivered from the
    # opa_policy_token file-secret by the container entrypoint.
    token: ${OPA_TOKEN:}
    policy-push:
      enabled: ${OPA_POLICY_PUSH_ENABLED:false}
      load-base-if-absent: ${OPA_POLICY_PUSH_LOAD_BASE_IF_ABSENT:true}
      base-policy-id: ${OPA_POLICY_PUSH_BASE_POLICY_ID:netherite-authz-base}
      max-rego-bytes: ${OPA_POLICY_PUSH_MAX_REGO_BYTES:100000}
      # Interval (ms) of the periodic reconciliation that re-installs any ACTIVE
      # module that vanished from the (in-memory) engine — e.g. after an OPA
      # restart. Keeps the audited ACTIVE state equal to the enforced state.
      reconcile-interval-ms: ${OPA_POLICY_PUSH_RECONCILE_INTERVAL_MS:60000}
  llm:
    # Provider-independent semantic normalization. Disabled by default: with 'none' no
    # LlmProvider bean exists and every natural-language request fails closed. Set
    # LLM_PROVIDER=gemini to enable Google Gemini interpretation (never authorization).
    provider: ${LLM_PROVIDER:none}
    # Optional model override; blank uses the provider default below.
    model: ${LLM_MODEL:}
    timeout-ms: ${LLM_TIMEOUT_MS:10000}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:1024}
    max-response-bytes: ${LLM_MAX_RESPONSE_BYTES:262144}
    gemini:
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      # No baked-in secret: the key MUST arrive from the environment (GEMINI_API_KEY).
      # It is never logged, echoed, or persisted; a blank value fails startup fast when
      # the gemini provider is selected.
      api-key: ${GEMINI_API_KEY:}
      default-model: ${GEMINI_MODEL:gemini-2.0-flash}
    openrouter:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      # No baked-in secret: the key MUST arrive from the environment
      # (OPENROUTER_API_KEY). It is never logged, echoed, or persisted; a
      # blank value fails startup fast when the openrouter provider is selected.
      api-key: ${OPENROUTER_API_KEY:}
      default-model: ${OPENROUTER_MODEL:nvidia/nemotron-3-ultra-550b-a55b:free}
  auth:
    owner:
      email: ${OWNER_EMAIL:strangeunknown03@gmail.com}
      # No baked-in default hash: the value MUST arrive from the environment
      # (production: OWNER_PASSWORD_HASH injected by the container entrypoint from
      # the file-based docker secret). An empty value makes the runtime
      # configuration validator fail fast instead of silently accepting a default.
      password-hash: ${OWNER_PASSWORD_HASH:}
      organization-name: ${OWNER_ORG_NAME:NetheriteAgent}
      organization-slug: ${OWNER_ORG_SLUG:netherite}
    oidc:
      enabled: ${OIDC_ENABLED:false}
      callback-base-url: ${OIDC_CALLBACK_BASE_URL:http://localhost:3000}
      external-base-url: ${OIDC_EXTERNAL_BASE_URL:http://localhost:8080}
      flow-timeout-seconds: ${OIDC_FLOW_TIMEOUT:300}
    session:
      cookie-name: ${SESSION_COOKIE_NAME:neth_sid}
      cookie-secure: ${SESSION_COOKIE_SECURE:}
      cookie-same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
      ttl-seconds: ${SESSION_TTL_SECONDS:86400}
  security:
    # Base64-encoded 256-bit AES key for encrypting/decrypting resource credentials at rest.
    # Required when any ResourceEntity carries encrypted_credentials. Without it, resources
    # with encrypted credentials fail closed at route resolution time. Never commit a real
    # key to version control; inject via environment variable CREDENTIAL_ENCRYPTION_KEY.
    credential-encryption-key: ${CREDENTIAL_ENCRYPTION_KEY:}
    ssrf-guard:
      enabled: true
      # Operator-configured egress (OIDC issuer/JWKS/token, OPA, webhooks) is allowed to
      # reach private networks because internal IdPs and policy engines are legitimate in
      # this deployment. Tenant-facing egress (resource connectors, health checks) remains
      # strict and always blocks RFC1918/loopback/link-local via implicit rules below.
      allow-private-operator-configured: ${SSRF_GUARD_ALLOW_PRIVATE_OPERATOR:true}
      blocked-cidrs:
        - 0.0.0.0/8
        - 100.64.0.0/10
        - 169.254.0.0/16
        - 192.0.0.0/24
        - 192.0.2.0/24
        - 198.18.0.0/15
        - 198.51.100.0/24
        - 203.0.113.0/24
        - 224.0.0.0/4
        - 240.0.0.0/4
      # Port policy: egress to well-known internal/management ports is never a legitimate
      # connector/health-check/webhook target. Empty/absent list uses the hardened default
      # (SSH, SMTP, SMB, MSSQL, Oracle, MySQL, Postgres, Redis, Elasticsearch, Memcached,
      # Cassandra, MongoDB, Docker API, AKS/CPI admin ports, etc.).
      blocked-ports:
        - 22
        - 23
        - 25
        - 53
        - 111
        - 135
        - 139
        - 445
        - 1433
        - 1521
        - 2049
        - 2375
        - 2376
        - 3306
        - 3389
        - 5432
        - 5433
        - 5984
        - 6379
        - 6443
        - 9000
        - 9042
        - 9200
        - 9300
        - 11211
        - 15672
        - 27017
      # Exact host:port destinations that may reach private/loopback/ULA addresses. This is
      # NOT a CIDR or host-wide allowlist: the host and port must match exactly, the
      # destination is still resolved, and link-local/metadata/multicast/denied ranges stay
      # blocked. Defaults to the AI-ERP API on the Docker host gateway. Override with
      # SSRF_GUARD_ALLOWED_PRIVATE_DESTINATIONS (comma-separated exact host:port pairs).
      allowed-private-destinations:
        - "${SSRF_GUARD_ALLOWED_PRIVATE_DESTINATIONS:host.docker.internal:5000}"
  notifications:
    control-plane-url: ${CONTROL_PLANE_URL:http://localhost:3000}
    email:
      enabled: false
      from: ${MAIL_FROM:noreply@example.com}
      to: ${MAIL_TO:admin@example.com}
      smtp-host: ${MAIL_HOST:localhost}
      smtp-port: ${MAIL_PORT:587}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      protocol: smtp
      auth: true
      starttls-enable: true
    slack:
      enabled: false
      webhook-url: ${SLACK_WEBHOOK_URL:https://hooks.slack.com/services/CHANGE_ME}
    teams:
      enabled: false
      webhook-url: ${TEAMS_WEBHOOK_URL:https://outlook.office.com/webhook/CHANGE_ME}
    webhook:
      enabled: false
      url: ${WEBHOOK_URL:https://enterprise.example.com/webhooks/approvals}
      secret: ${WEBHOOK_SECRET:}
      connect-timeout-ms: 5000
      read-timeout-ms: 5000
      max-retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      # WS8: disable the actuator links/discovery page at /actuator — the only data it
      # disclosed was the endpoint list, and keeping the surface window as small as
      # possible trims management introspection for everyone (Caddy -blocked §WS8 too).
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db
  info:
    env:
      enabled: false

# WS8: constant 'environment' tag on every application metric (bounded values:
# development/test/production), so a single Prometheus can separate environments.
management.metrics.tags.environment: ${NETHERITE_ENV:development}
